<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巴士站實時到站查詢</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js (CDN) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800" x-data="etaFinder()" x-cloak>
  <div class="max-w-3xl mx-auto px-4 py-8">
    <!-- 導航 -->
    <nav class="mb-5 flex gap-3 text-sm font-medium">
      <a href="index.html" class="rounded-lg px-3 py-1.5 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">🚏 巴士站查詢</a>
      <span class="rounded-lg px-3 py-1.5 bg-blue-600 text-white">🕒 實時到站</span>
    </nav>

    <!-- Header -->
    <header class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
        🕒 巴士站實時到站查詢
      </h1>
      <p class="mt-1 text-sm text-slate-500">
        輸入 STOP ID，從
        <a class="text-blue-600 underline" href="https://data.gov.hk/" target="_blank" rel="noopener">data.gov.hk</a>
        API 取得該站所有途經路線的實時到站時間（九巴 KMB）。
        <span x-show="status === 'ready'" class="text-slate-400">
          已載入站名資料 <b x-text="stopNameCount"></b> 個。
        </span>
      </p>
    </header>

    <!-- 輸入區 -->
    <div class="bg-white rounded-xl shadow p-4 mb-3">
      <label for="sid" class="block text-sm font-medium text-slate-600 mb-1">
        巴士站 STOP ID
      </label>
      <div class="flex gap-2">
        <input id="sid" type="text"
               x-model="stopId"
               @keydown.enter="query()"
               placeholder="例如：99EF4CA10B3E1F17（豐力樓）"
               class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-base font-mono focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
        <button @click="query()"
                :disabled="querying"
                class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium text-sm">
          <span x-text="querying ? '查詢中…' : '查詢'"></span>
        </button>
      </div>
      <p x-show="stopName" class="mt-2 text-sm font-semibold text-slate-800">
        📍 <span x-text="stopName"></span>
        <span class="text-xs font-normal text-slate-400" x-text="'STOP ID: ' + stopId.toUpperCase()"></span>
      </p>
    </div>

    <!-- 提示 / 錯誤 -->
    <template x-if="error">
      <div class="mb-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm p-3">
        ⚠️ <span x-text="error"></span>
      </div>
    </template>
    <template x-if="empty">
      <div class="mb-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-700 text-sm p-3">
        ℹ️ 該 STOP ID 目前沒有實時到站資料（可能無服務或查詢方式有誤）。
      </div>
    </template>

    <!-- 結果標題 -->
    <template x-if="queriedAt && groups.length">
      <p class="text-xs text-slate-400 mb-2">
        資料時間：<span x-text="queriedAt"></span>
        <span class="ml-2">共 <b x-text="groups.length"></b> 條途經路線</span>
      </p>
    </template>

    <!-- 路線卡片 -->
    <div class="grid gap-3">
      <template x-for="g in groups" :key="g.key">
        <div class="bg-white rounded-xl shadow p-4 border-l-4"
             :class="g.dir === 'O' ? 'border-blue-500' : 'border-emerald-500'">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xl font-bold text-slate-900" x-text="g.route"></span>
              <span class="text-xs rounded px-1.5 py-0.5 font-medium"
                    :class="g.dir === 'O' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'"
                    x-text="g.dir === 'O' ? '出程' : '回程'"></span>
              <span class="text-sm text-slate-600" x-text="'往 ' + g.dest_tc"></span>
            </div>
            <span class="text-xs text-slate-400" x-text="g.etas.length > 1 ? '接下來 ' + g.etas.length + ' 班' : ''"></span>
          </div>
          <p class="text-xs text-slate-400" x-text="g.dest_en"></p>

          <div class="mt-3 flex flex-col gap-2">
            <template x-for="(e, i) in g.etas" :key="g.key + '-' + i">
              <div class="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2">
                <span class="text-sm font-medium"
                      :class="e.mins < 0 ? 'text-slate-400' : 'text-slate-800'"
                      x-text="e.mins < 0 ? '已開出' : (e.mins === 0 ? '即將到站' : e.mins + ' 分鐘')"></span>
                <div class="text-right">
                  <span class="text-sm text-slate-700 font-mono" x-text="e.time"></span>
                  <span x-show="e.rmk" class="block text-xs text-amber-600" x-text="e.rmk"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    const API = 'https://data.etabus.gov.hk/v1/transport/kmb';

    async function fetchJson(url, attempts = 3) {
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try {
          const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return await res.json();
        } catch (e) {
          lastErr = e;
          if (i < attempts - 1) await new Promise(r => setTimeout(r, 1500 * (i + 1)));
        }
      }
      throw lastErr;
    }

    function etaFinder() {
      return {
        status: 'idle',
        stopId: '',
        stopName: '',
        stopNameCount: 0,
        nameByStop: new Map(),     // stopId -> name_tc
        querying: false,
        error: '',
        empty: false,
        queriedAt: '',
        groups: [],

        async init() {
          // 可選：載入 stop 列表做站名映射（失敗不阻斷查詢）
          try {
            const d = await fetchJson(API + '/stop');
            for (const s of (d.data || [])) this.nameByStop.set(s.stop, s.name_tc || '');
            this.stopNameCount = this.nameByStop.size;
            this.status = 'ready';
          } catch (e) {
            this.status = 'ready';
          }
        },

        async query() {
          const id = this.stopId.trim();
          if (!id) { this.error = '請先輸入 STOP ID。'; return; }
          this.querying = true;
          this.error = '';
          this.empty = false;
          this.groups = [];
          this.queriedAt = '';
          this.stopName = this.nameByStop.get(id) || '';
          try {
            const d = await fetchJson(API + '/stop-eta/' + encodeURIComponent(id), 3);
            const now = new Date();
            const byKey = new Map();
            for (const e of (d.data || [])) {
              if (e.co && e.co !== 'KMB') continue;   // 只需九巴
              const key = e.route + '|' + e.dir + '|' + e.service_type;
              let g = byKey.get(key);
              if (!g) {
                g = {
                  key,
                  route: e.route,
                  dir: e.dir,
                  service_type: e.service_type,
                  dest_tc: e.dest_tc || '',
                  dest_en: e.dest_en || '',
                  etas: []
                };
                byKey.set(key, g);
              }
              const etaDate = new Date(e.eta);
              g.etas.push({
                mins: Math.floor((etaDate - now) / 60000),
                time: this.formatTime(etaDate),
                rmk: e.rmk_tc || ''
              });
            }
            this.groups = Array.from(byKey.values())
              .sort((a, b) => a.route.localeCompare(b.route, 'en', { numeric: true })
                              || a.dir.localeCompare(b.dir));
            if (!this.groups.length) { this.empty = true; }
            this.queriedAt = this.formatTime(d.data_timestamp ? new Date(d.data_timestamp) : now);
          } catch (e) {
            this.error = '查詢失敗：' + e.message + '。請確認網絡連線後重試。';
          } finally {
            this.querying = false;
          }
        },

        formatTime(dt) {
          if (!(dt instanceof Date) || isNaN(dt)) return '';
          const p = n => String(n).padStart(2, '0');
          return p(dt.getHours()) + ':' + p(dt.getMinutes());
        }
      };
    }
  </script>
</body>
</html>
