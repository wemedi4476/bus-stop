<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巴士站 STOP ID 查詢工具</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js (CDN) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800" x-data="stopFinder()" x-cloak>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-2">
        🚌 巴士站 STOP ID 查詢工具
      </h1>
      <p class="mt-1 text-sm text-slate-500">
        支援九巴 (KMB) 巴士站，資料來源：
        <a class="text-blue-600 underline"
           href="https://data.gov.hk/"
           target="_blank" rel="noopener">data.gov.hk</a>
        <span class="mx-1">·</span>
        以站名搜尋 STOP ID，並顯示所有途經路線及「往」的方向
      </p>
    </header>

    <!-- Status bar -->
    <div class="mb-4 rounded-lg border p-3 text-sm shadow-sm"
         :class="{
           'bg-amber-50 border-amber-200 text-amber-700': status === 'loading',
           'bg-green-50 border-green-200 text-green-700': status === 'ready',
           'bg-red-50 border-red-200 text-red-700': status === 'error'
         }">
      <template x-if="status === 'loading'">
        <p class="flex items-center gap-2">
          <span class="inline-block w-4 h-4 border-2 border-amber-600 border-t-transparent rounded-full animate-spin"></span>
          <span x-text="loadMsg"></span>
        </p>
      </template>
      <template x-if="status === 'ready'">
        <p>
          ✅ 已載入 <b x-text="all.length"></b> 個九巴巴士站、<b x-text="routeCount"></b> 條路線方向資料 —
          輸入站名即時搜尋（可輸入繁體 / 簡體 / 英文）。
        </p>
      </template>
      <template x-if="status === 'error'">
        <p>⚠️ <span x-text="error"></span></p>
      </template>
    </div>

    <!-- Search box -->
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <label for="q" class="block text-sm font-medium text-slate-600 mb-1">
        搜尋巴士站名稱
      </label>
      <div class="flex gap-2">
        <input id="q" type="text"
               x-model="q"
               placeholder="例如：中環、Central、四美街、竹園…"
               class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
        <button @click="clearQuery()"
                class="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm">
          清除
        </button>
      </div>
      <p class="mt-2 text-xs text-slate-400">
        顯示 <b><span x-text="results.length"></span></b> / <b><span x-text="all.length"></span></b> 個結果
      </p>
    </div>

    <!-- Results -->
    <template x-if="status === 'ready' && q.trim() === ''">
      <div class="bg-white rounded-xl shadow p-4 text-center text-sm text-slate-400">
        ← 請輸入巴士站名稱開始搜尋
      </div>
    </template>

    <template x-if="status === 'ready' && q.trim() !== '' && results.length === 0">
      <div class="bg-white rounded-xl shadow p-8 text-center text-slate-500">
        <p class="text-3xl mb-2">🔍</p>
        <p>找不到符合「<b x-text="q"></b>」的巴士站，請試試其他關鍵字。</p>
      </div>
    </template>

    <div class="grid gap-3 md:grid-cols-2">
      <template x-for="s in results" :key="s.stop">
        <div class="bg-white rounded-xl shadow p-4 border-l-4 border-blue-500 hover:shadow-md transition">
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-semibold text-slate-900 leading-snug" x-text="s.name_tc"></h3>
            <button @click="copy(s.stop)"
                    class="shrink-0 rounded bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 font-medium"
                    title="複製 STOP ID"
                    x-text="copied === s.stop ? '✓ 已複製' : '複製'">
            </button>
          </div>
          <p class="text-sm text-slate-500" x-text="s.name_en"></p>
          <p class="text-xs text-slate-400" x-text="'簡體：' + s.name_sc"></p>
          <div class="mt-2 flex items-center gap-2 text-xs font-mono">
            <span class="bg-slate-100 rounded px-2 py-1 text-slate-700">STOP ID: <b x-text="s.stop"></b></span>
            <span class="text-slate-400" x-text="'(' + s.lat + ', ' + s.long + ')'"></span>
          </div>

          <!-- 途經路線 + 方向 -->
          <div class="mt-3 pt-3 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-500 mb-2 flex items-center justify-between">
              <span>🚏 途經路線（<span x-text="s.routes.length"></span> 條）</span>
              <button @click="s.expand = !s.expand"
                      x-show="s.routes.length > maxPreviews"
                      class="text-blue-600 underline">
                <span x-text="s.expand ? '收合' : '顯示全部'"></span>
              </button>
            </p>
            <div class="flex flex-wrap gap-1.5">
              <template x-for="r in (s.expand ? s.routes : s.routes.slice(0, maxPreviews))" :key="r.key">
                <span :title="'往 ' + r.dest_tc + ' / ' + r.dest_en"
                      class="inline-flex items-center gap-1 rounded-md bg-blue-50 border border-blue-200 text-blue-800 px-2 py-0.5 text-xs">
                  <b class="font-bold" x-text="r.route"></b>
                  <span class="text-slate-600" x-text="'往 ' + r.dest_tc"></span>
                </span>
              </template>
              <span x-show="!s.expand && s.routes.length > maxPreviews"
                    class="inline-flex items-center text-xs text-slate-400">
                +<span x-text="s.routes.length - maxPreviews"></span>
              </span>
            </div>
          </div>

          <a :href="'https://www.google.com/maps?q=' + s.lat + ',' + s.long"
             target="_blank" rel="noopener"
             class="mt-3 inline-block text-xs text-blue-600 underline">
            在地圖上查看 →
          </a>
        </div>
      </template>
    </div>
  </div>

  <script>
    const API = 'https://data.etabus.gov.hk/v1/transport/kmb';

    async function fetchWithRetry(path, attempts = 3) {
      let lastErr;
      for (let i = 0; i < attempts; i++) {
        try {
          const res = await fetch(API + path, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return await res.json();
        } catch (e) {
          lastErr = e;
          if (i < attempts - 1) await new Promise(r => setTimeout(r, 1500 * (i + 1)));
        }
      }
      throw lastErr;
    }

    function stopFinder() {
      return {
        status: 'idle',       // idle | loading | ready | error
        error: '',
        loadMsg: '',
        all: [],
        routesByStop: new Map(),   // stopId -> Map(routeKey -> {key, route, bound, dest_tc, dest_en})
        routeCount: 0,
        q: '',
        copied: null,
        maxPreviews: 8,

        get results() {
          const kw = this.q.trim().toLowerCase();
          if (!kw) return [];
          return this.all.filter(s => {
            return (s.name_tc && s.name_tc.toLowerCase().includes(kw))
                || (s.name_sc && s.name_sc.toLowerCase().includes(kw))
                || (s.name_en && s.name_en.toLowerCase().includes(kw));
          }).slice(0, 100).map(s => this.decorate(s));
        },

        decorate(s) {
          const rMap = this.routesByStop.get(s.stop);
          let routes = [];
          if (rMap) {
            routes = Array.from(rMap.values())
              .sort((a, b) => a.route.localeCompare(b.route, 'en', { numeric: true })
                              || a.bound.localeCompare(b.bound));
          }
          return { ...s, routes, expand: false };
        },

        async init() {
          this.status = 'loading';
          try {
            // 1) 站點
            this.loadMsg = '正在下載九巴巴士站資料…';
            const stopData = await fetchWithRetry('/stop');
            this.all = (stopData.data || []).map(d => ({
              stop: d.stop, name_tc: d.name_tc || '', name_sc: d.name_sc || '',
              name_en: d.name_en || '', lat: d.lat || '', long: d.long || ''
            }));

            // 2) 路線（含「往」方向）
            this.loadMsg = '正在下載路線／方向資料…';
            const routeData = await fetchWithRetry('/route');
            const routeMap = new Map();
            for (const r of (routeData.data || [])) {
              routeMap.set(r.route + '|' + r.bound + '|' + r.service_type, r);
            }
            this.routeCount = routeMap.size;

            // 3) 站點 ↔ 路線對應（體積較大）
            this.loadMsg = '正在下載站點與路線對應資料（體積較大，需稍候）…';
            const rsData = await fetchWithRetry('/route-stop', 3);

            // 建立 stopId -> 途經路線索引，按 route|bound 去重
            //（同一路線及方向只顯示一次；不同 service_type 的特別/特快班次合併顯示，
            //  但「出程 O / 回程 I」不同方向仍分開顯示）
            const idx = new Map();
            for (const x of (rsData.data || [])) {
              const key = x.route + '|' + x.bound + '|' + x.service_type;
              const destKey = x.route + '|' + x.bound;
              let m = idx.get(x.stop);
              if (!m) { m = new Map(); idx.set(x.stop, m); }
              if (!m.has(destKey)) {
                const rr = routeMap.get(key);
                m.set(destKey, {
                  key: destKey,
                  route: x.route,
                  bound: x.bound,
                  dest_tc: (rr && rr.dest_tc) || '',
                  dest_en: (rr && rr.dest_en) || '',
                });
              }
            }
            this.routesByStop = idx;

            this.status = 'ready';
          } catch (e) {
            this.error = '無法載入資料：' + e.message + '。請確認網絡連線後重新整理頁面重試。';
            this.status = 'error';
          }
        },

        clearQuery() {
          this.q = '';
        },

        async copy(text) {
          try {
            await navigator.clipboard.writeText(text);
            this.copied = text;
            setTimeout(() => { if (this.copied === text) this.copied = null; }, 1500);
          } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            this.copied = text;
            setTimeout(() => { if (this.copied === text) this.copied = null; }, 1500);
          }
        }
      };
    }
  </script>
</body>
</html>
