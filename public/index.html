<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的路線 — 巴士實時到站</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js (CDN) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Phosphor Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800" x-data="myRoutes()" x-cloak>
  <div class="max-w-4xl mx-auto px-3 py-3">
    <!-- 導航 -->
    <nav class="mb-2 flex flex-wrap gap-2 text-xs font-medium">
      <span class="rounded-lg px-2.5 py-1 bg-blue-600 text-white inline-flex items-center gap-1"><i class="ph ph-house"></i> 我的路線</span>
      <a href="search.html" class="rounded-lg px-2.5 py-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 inline-flex items-center gap-1"><i class="ph ph-magnifying-glass"></i> 巴士站查詢</a>
      <a href="eta.html" class="rounded-lg px-2.5 py-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 inline-flex items-center gap-1"><i class="ph ph-clock"></i> 實時到站</a>
    </nav>



    <!-- Status bar -->
    <div class="mb-2 rounded-lg border px-2.5 py-1 text-xs shadow-sm"
         :class="{
           'bg-amber-50 border-amber-200 text-amber-700': status === 'loading',
           'bg-green-50 border-green-200 text-green-700': status === 'ready',
           'bg-red-50 border-red-200 text-red-700': status === 'error'
         }">
      <template x-if="status === 'loading'">
        <p class="flex items-center gap-2">
          <span class="inline-block w-4 h-4 border-2 border-amber-600 border-t-transparent rounded-full animate-spin"></span>
          <span>正在讀取你的路線與實時到站…</span>
        </p>
      </template>
      <template x-if="status === 'ready'">
        <p>
          <i class="ph ph-check-circle"></i> 已載入 <b x-text="selection.length"></b> 條路線。
          <span class="text-slate-400">
            資料時間 <span x-text="updatedAt"></span> ·
            <button @click="refreshSel()" :disabled="selRefreshing" class="text-blue-600 underline">
              <span x-text="selRefreshing ? '更新中…' : '重新整理'"></span>
            </button>
          </span>
        </p>
      </template>
      <template x-if="status === 'error'">
        <p class="inline-flex items-center gap-1"><i class="ph ph-warning"></i><span x-text="error"></span></p>
      </template>
    </div>

    <!-- 沒有路線時的空狀態 -->
    <template x-if="status === 'ready' && selection.length === 0">
      <div class="bg-white rounded-xl shadow p-6 text-center">
        <p class="text-4xl mb-2 flex justify-center text-blue-600"><i class="ph ph-bus"></i></p>
        <h2 class="text-base font-semibold text-slate-700 mb-1">你還沒有收藏任何路線</h2>
        <p class="text-xs text-slate-500 mb-4">到巴士站查詢搜尋車站，點擊路線並選「上班／回家」即可在此追蹤它的實時到站。</p>
        <a href="search.html"
           class="inline-block rounded-lg bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 font-medium text-sm">
          <i class="ph ph-bus"></i> 前往巴士站查詢
        </a>
      </div>
    </template>

    <!-- 我的路線列表：同一車站合併成一張卡片，站內列出該站所有已選路線 -->
    <template x-if="status === 'ready' && selection.length">
      <!-- 內容容器（單一根，供 x-if 呈現） -->
      <div class="flex flex-col gap-2">
        <!-- tabs：一次只顯示一個分類（上班／回家），減少捲動 -->
        <div class="grid grid-cols-2 gap-2">
        <template x-for="g in GROUPS" :key="g.id">
          <button type="button"
                  @click="activeGroup = g.id"
                  :class="activeGroup === g.id
                        ? (g.color === 'emerald' ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-blue-600 border-blue-600 text-white')
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'"
                  class="flex items-center justify-center gap-1.5 rounded-lg border px-2 py-1.5 text-sm font-bold">
            <i :class="g.icon" class="ph"></i>
            <span x-text="g.label"></span>
            <span class="text-xs font-medium opacity-80" x-text="'(' + groupCount(g.id) + ')'"></span>
          </button>
        </template>
      </div>

      <!-- 只渲染選中分類 -->
      <template x-if="activeSection">
        <section>

            <template x-if="activeSection.groups.length === 0">
              <div class="bg-white rounded-xl shadow p-3 text-center text-xs text-slate-400">
                尚無 <b x-text="activeSection.label"></b> 路線。到<a href="search.html" class="text-blue-600 underline mx-1">巴士站查詢</a>搜尋車站後選「<span x-text="activeSection.label"></span>」加入。
              </div>
            </template>

            <template x-if="activeSection.groups.length">
              <div class="grid gap-2 md:grid-cols-2">
                <template x-for="grp in activeSection.groups" :key="activeSection.gid + '-g' + grp.stop">
                  <div class="bg-white rounded-lg shadow-sm p-2 border-l-4"
                       :class="activeSection.color === 'emerald' ? 'border-emerald-500' : 'border-blue-500'">
                    <div class="flex items-baseline gap-1.5 min-w-0">
                      <p class="text-sm font-semibold text-slate-900 inline-flex items-center gap-1 min-w-0">
                        <i class="ph ph-map-pin text-blue-600 shrink-0"></i><span class="truncate" x-text="grp.stopName"></span>
                      </p>
                      <p class="text-[10px] text-slate-400 font-mono shrink-0" x-text="grp.stop"></p>
                    </div>

                    <div class="mt-1.5 flex flex-col gap-1">
                      <template x-for="it in grp.items" :key="it.key">
                        <div class="rounded-lg border border-slate-200 bg-slate-50 px-2 py-1">
                          <div class="flex items-start justify-between gap-2">
                            <p class="text-sm font-bold text-slate-900 flex items-center gap-1.5 min-w-0">
                              <i class="ph ph-bus text-blue-600 shrink-0"></i>
                              <span x-text="it.route"></span>
                              <span class="text-[11px] font-medium text-slate-500 truncate" x-text="'往 ' + it.dest_tc"></span>
                            </p>
                            <button @click="removeItem(it)" :disabled="selRefreshing"
                                    class="shrink-0 rounded border border-slate-200 bg-white hover:bg-red-100 text-slate-400 hover:text-red-600 text-[11px] px-1 py-0.5"
                                    title="移除此路線">
                              <i class="ph ph-x text-xs"></i>
                            </button>
                          </div>

                          <div class="mt-0.5" x-show="it.loading">
                            <p class="text-[11px] text-slate-400">⏳ 查詢實時到站中…</p>
                          </div>
                          <div class="mt-0.5" x-show="it.error && !it.loading">
                            <p class="text-[11px] text-amber-600" x-text="it.error"></p>
                          </div>

                          <template x-if="!it.loading && !it.error">
                            <div class="mt-1 grid grid-cols-3 gap-1">
                              <template x-for="(e, i) in it.etas" :key="it.key + '-' + i">
                                <!-- 單一根元素：灰=僅第一班已開出；紅=第一個真正會到站；其餘=藍 -->
                                <span :class="(i === 0 && e.mins < 0)
                                      ? 'flex min-w-0 items-center justify-center gap-1 overflow-hidden whitespace-nowrap rounded-md bg-gray-400 text-white px-1 py-0.5 text-xs font-semibold'
                                      : (i === firstArrivingIdx(it.etas)
                                          ? 'flex min-w-0 items-center justify-center gap-1 overflow-hidden whitespace-nowrap rounded-md bg-red-600 text-white px-1 py-1 text-xs font-bold shadow ring-2 ring-red-300'
                                          : 'flex min-w-0 items-center justify-center gap-1 overflow-hidden whitespace-nowrap rounded-md bg-blue-600 text-white px-1 py-1 text-xs font-semibold')">
                                  <template x-if="i === 0 && e.mins < 0">
                                    <span class="hidden text-[10px] font-bold uppercase tracking-wide bg-gray-500 text-white rounded px-1 py-0.5 lg:inline">已開出</span>
                                  </template>
                                  <template x-if="i === firstArrivingIdx(it.etas) && !(i === 0 && e.mins < 0)">
                                    <span class="hidden text-[10px] font-bold uppercase tracking-wide bg-red-500 text-white rounded px-1 py-0.5 lg:inline">最早</span>
                                  </template>
                                  <span x-text="selMins(e.mins)"></span>
                                  <template x-if="!(i === 0 && e.mins < 0)">
                                    <span :class="i === firstArrivingIdx(it.etas) ? 'text-[10px] font-normal text-red-100' : 'text-[10px] font-normal text-blue-200'" x-text="e.time"></span>
                                  </template>
                                </span>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
        </section>
        </template>
      </div>
    </template>
	
    <!-- Footer -->
	<div>
    <header class="mt-3 mb-1">
      <h1 class="text-lg font-bold text-slate-900 flex items-center gap-1.5">
        <i class="ph ph-star-fill text-blue-600"></i> 我的路線
      </h1>
      <p class="mt-1 text-xs text-slate-500 leading-relaxed">
        你收藏的巴士路線，分成 <b class="text-slate-700">上班</b> 與 <b class="text-slate-700">回家</b> 兩個分類，每條顯示接下來 <b class="text-slate-700">3 班</b> 的實時到站時間（九巴 KMB）。
        <span class="mx-1">·</span>
        到 <a href="search.html" class="text-blue-600 underline inline-flex items-center gap-1"><i class="ph ph-bus"></i> 巴士站查詢</a> 搜尋車站並在路線 popup 中選「上班／回家」加入；分類同樣在 popup 中切換，移除請按該路線的 <b class="text-slate-700">✕</b>。
      </p>
    </header>	
	</div>	
  </div>

  <script src="app.js"></script>
  <script>
    function myRoutes() {
      return Object.assign({
        status: 'idle',
        error: '',
        updatedAt: '',
        selection: [],
        selRefreshing: false,
        // 目前選中的分類 tab（tabs 一次只顯示一個分類）
        activeGroup: 'work',
        // 分類群組
        GROUPS: [
          { id: 'work', label: '上班', icon: 'ph-briefcase', color: 'blue' },
          { id: 'home', label: '回家', icon: 'ph-house', color: 'emerald' }
        ],
        // 依「群組 → 同一車站」分組：每個群組一區，區內每站一張卡片，站內列出該站所有已選路線
        get groupSections() {
          const sections = this.GROUPS.map(g => ({ gid: g.id, label: g.label, icon: g.icon, color: g.color, groups: [] }));
          const byGroup = new Map();
          for (const it of this.selection) {
            const gid = (it.group === 'work' || it.group === 'home') ? it.group : 'work';
            if (!byGroup.has(gid)) byGroup.set(gid, new Map());
            const map = byGroup.get(gid);
            if (!map.has(it.stop)) map.set(it.stop, { stop: it.stop, stopName: it.stopName, items: [] });
            map.get(it.stop).items.push(it);
          }
          for (const sec of sections) {
            const map = byGroup.get(sec.gid);
            if (!map) continue;
            for (const grp of map.values()) {
              grp.items.sort((a, b) => this.earliestMins(a) - this.earliestMins(b));
              sec.groups.push(grp);
            }
          }
          return sections;
        },

        // 目前選中分類的 section（單一區，供 tabs 一次只顯示一個分類）
        get activeSection() {
          return (this.groupSections || []).find(s => s.gid === this.activeGroup) || null;
        },

        // 某分類收錄的路線總數（tabs 上的計數）
        groupCount(gid) {
          return this.selection.filter(it => it.group === gid).length;
        },

        // 該路線最早一班的到站分鐘數；無實時資料時視為無限大（排最後）
        earliestMins(item) {
          if (item.etas && item.etas.length) {
            return Math.min(...item.etas.map(e => e.mins));
          }
          return Infinity;
        },

        // 第一個真正會到站（mins >= 0）的車在 etas 中的索引；全部已開出時為 -1
        firstArrivingIdx(etas) {
          if (Array.isArray(etas)) {
            return etas.findIndex(e => e.mins >= 0);
          }
          return -1;
        },

        async init() {
          this.status = 'loading';
          // 讀回收藏（localStorage），並於雲端/本機共用相同流程
          this.restoreSelection();
          this.status = 'ready';
          if (this.selection.length) {
            await this.refreshSel();
          }
        },

        async refreshOne(item) {
          item.loading = true;
          item.error = '';
          try {
            const d = await fetchJson(API_BASE + '/eta/' + encodeURIComponent(item.stop), 3);
            const now = new Date();
            const list = (d.data || [])
              .filter(e => e.route === item.route && e.dir === item.bound && (!e.co || e.co === 'KMB'))
              .map(e => new Date(e.eta))
              .filter(dt => !isNaN(dt))
              .sort((a, b) => a - b);
            item.etas = list.slice(0, 3).map(dt => ({
              mins: Math.floor((dt - now) / 60000),
              time: this.formatTime(dt)
            }));
            if (!item.etas.length) {
              item.error = '目前沒有該路線的實時到站資料';
            }
          } catch (e) {
            item.error = '查詢失敗：' + e.message;
          } finally {
            item.loading = false;
          }
        },

        async refreshSel() {
          this.selRefreshing = true;
          await Promise.all(this.selection.map(it => this.refreshOne(it)));
          this.selRefreshing = false;
          this.updatedAt = this.formatTime(new Date());
        },

        // 移除單一路線（同一車站的其他路線保留）
        removeItem(item) {
          this.selection = this.selection.filter(it => it.key !== item.key);
          this.saveSelection();
        },

        selMins(mins) {
          if (mins < 0) return '已開出';
          if (mins === 0) return '即將到站';
          return mins + ' 分鐘';
        }
      }, bustop);
    }
  </script>
</body>
</html>
