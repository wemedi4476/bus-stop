<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巴士站 STOP ID 查詢工具</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js (CDN) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Phosphor Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800" x-data="stopFinder()" x-cloak>
  <div class="max-w-4xl mx-auto px-3 py-3">
    <!-- 導航 -->
    <nav class="mb-2 flex flex-wrap gap-2 text-xs font-medium">
      <a href="index.html" class="rounded-lg px-2.5 py-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 inline-flex items-center gap-1"><i class="ph ph-house"></i> 我的路線</a>
      <span class="rounded-lg px-2.5 py-1 bg-blue-600 text-white inline-flex items-center gap-1"><i class="ph ph-magnifying-glass"></i> 巴士站查詢</span>
      <a href="eta.html" class="rounded-lg px-2.5 py-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 inline-flex items-center gap-1"><i class="ph ph-clock"></i> 實時到站</a>
    </nav>

    <!-- Header -->
    <header class="mb-3">
      <h1 class="text-lg font-bold text-slate-900 flex items-center gap-1.5">
        <i class="ph ph-bus text-blue-600"></i> 巴士站 STOP ID 查詢工具
      </h1>
      <p class="mt-1 text-xs text-slate-500 leading-relaxed">
        支援九巴 (KMB) 巴士站，資料來源：
        <a class="text-blue-600 underline"
           href="https://data.gov.hk/"
           target="_blank" rel="noopener">data.gov.hk</a>
        <span class="mx-1">·</span>
        以站名搜尋 STOP ID，並顯示所有途經路線及「往」的方向
      </p>
    </header>

    <!-- Status bar -->
    <div class="mb-2 rounded-lg border px-2.5 py-1 text-xs shadow-sm"
         :class="{
           'bg-amber-50 border-amber-200 text-amber-700': status === 'loading',
           'bg-green-50 border-green-200 text-green-700': status === 'ready',
           'bg-red-50 border-red-200 text-red-700': status === 'error'
         }">
      <template x-if="status === 'loading'">
        <p class="flex items-center gap-2">
          <span class="inline-block w-4 h-4 border-2 border-amber-600 border-t-transparent rounded-full animate-spin"></span>
          <span>正在載入車站資料…</span>
        </p>
      </template>
      <template x-if="status === 'ready'">
        <p>
          <i class="ph ph-check-circle"></i> 資料已預建：<b x-text="allCount"></b> 個站、<b x-text="routeCount"></b> 條路線。
          輸入站名即時搜尋（可輸入繁體 / 簡體 / 英文）。
        </p>
      </template>
      <template x-if="status === 'error'">
        <p class="inline-flex items-center gap-1"><i class="ph ph-warning"></i><span x-text="error"></span></p>
      </template>
    </div>

    <!-- Search box -->
    <div class="bg-white rounded-xl shadow p-2.5 mb-2">
      <label for="q" class="block text-xs font-medium text-slate-600 mb-1">
        搜尋巴士站名稱
      </label>
      <div class="flex gap-2">
        <input id="q" type="text"
               x-model="q"
               @input.debounce.250ms="doSearch()"
               :disabled="status !== 'ready'"
               placeholder="例如：中環、Central、四美街、竹園…"
               class="flex-1 rounded-lg border border-slate-300 px-2.5 py-1.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-400 disabled:bg-slate-100"
        />
        <button @click="clearQuery()"
                class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm">
          清除
        </button>
      </div>
      <p class="mt-1 text-[11px] text-slate-400">
        <span x-show="searching" class="inline-flex items-center gap-1"><i class="ph ph-magnifying-glass"></i> 搜尋中…</span>
        <span x-show="!searching && q.trim()">
          顯示 <b x-text="results.length"></b> 個結果<span x-show="matchCount > results.length">（共 <b x-text="matchCount"></b> 筆，只列前 40）</span>
        </span>
      </p>
    </div>

    <!-- 提示：已選路線會顯示在主頁「我的路線」 -->
    <div class="mb-2 rounded-xl border border-blue-200 bg-blue-50 px-2.5 py-1.5 text-xs text-blue-800">
      <p class="flex items-center gap-1.5 flex-wrap">
        <i class="ph ph-star-fill text-blue-600"></i>
        已選取 <b><span x-text="selection.length"></span></b> 條路線 —
        <template x-for="g in GROUPS" :key="g.id">
          <span class="inline-flex items-center gap-1">
            <i :class="g.icon" class="ph text-blue-600"></i><span x-text="g.label"></span>
            <b x-text="selection.filter(it => it.group === g.id).length"></b>
          </span>
        </template>
        。點選下方路線再選「上班／回家」即加入收藏並返回這裡；
        到 <a href="index.html" class="underline font-medium inline-flex items-center gap-1"><i class="ph ph-house"></i> 我的路線</a> 主頁查看各分類接下來 3 班的實時到站時間。
      </p>
    </div>

    <!-- Results -->
    <template x-if="status === 'ready' && q.trim() === ''">
      <div class="bg-white rounded-xl shadow p-3 text-center text-xs text-slate-400">
        ← 請輸入巴士站名稱開始搜尋
      </div>
    </template>

    <template x-if="status === 'ready' && q.trim() !== '' && !searching && results.length === 0">
      <div class="bg-white rounded-xl shadow p-5 text-center text-sm text-slate-500">
        <p class="text-2xl mb-1 flex justify-center text-slate-400"><i class="ph ph-magnifying-glass"></i></p>
        <p>找不到符合「<b x-text="q"></b>」的巴士站，請試試其他關鍵字。</p>
      </div>
    </template>

    <div class="grid gap-2 md:grid-cols-2">
      <template x-for="s in results" :key="s.stop">
        <div :id="'stop-' + s.stop"
             :class="flashStop === s.stop ? 'ring-2 ring-blue-500 ring-offset-2' : ''"
             class="bg-white rounded-lg shadow p-3 border-l-4 border-blue-500 hover:shadow-md transition">
          <div class="flex items-start justify-between gap-2">
            <h3 class="text-sm font-semibold text-slate-900 leading-snug" x-text="s.name_tc"></h3>
            <button @click="copy(s.stop)"
                    class="shrink-0 rounded bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 font-medium"
                    title="複製 STOP ID"
                    x-text="copied === s.stop ? '✓ 已複製' : '複製'">
            </button>
          </div>
          <p class="text-xs text-slate-500" x-text="s.name_en"></p>
          <p class="text-[11px] text-slate-400" x-text="'簡體：' + s.name_sc"></p>
          <div class="mt-1 text-[11px] font-mono">
            <span class="bg-slate-100 rounded px-2 py-0.5 text-slate-700">STOP ID: <b x-text="s.stop"></b></span>
          </div>

          <!-- 途經路線 + 方向 -->
          <div class="mt-2 pt-2 border-t border-slate-100">
            <p class="text-[11px] font-semibold text-slate-500 mb-1">
              <i class="ph ph-bus"></i> 途經路線（<span x-text="s.routes.length"></span> 條）
            </p>
            <div class="flex flex-wrap gap-1">
              <template x-for="r in s.routes" :key="r.route + '-' + r.bound">
                <button type="button"
                        :class="{
                       'inline-flex items-center gap-1 rounded-md border px-2 py-0.5 text-xs cursor-pointer select-none transition': true,
                       'bg-blue-50 border-blue-200 text-blue-800 hover:bg-blue-100': true
                     }"
                      :title="'點擊查看 ' + r.route + ' 完整路線（往 ' + r.dest_tc + '）'"
                      @click="openRoute(r, s)">
                  <i x-show="isSelected(s.stop, r.route, r.bound)"
                     class="ph ph-star-fill -ml-0.5 mr-0.5 text-blue-600"></i>
                  <b class="font-bold" x-text="r.route"></b>
                  <span class="text-slate-600" x-text="'往 ' + r.dest_tc"></span>
                </button>
              </template>
            </div>
          </div>

          <div class="mt-2 flex items-center gap-2">
            <a :href="'https://www.google.com/maps?q=' + s.lat + ',' + s.lng"
               target="_blank" rel="noopener"
               class="text-[11px] text-blue-600 underline">
              在地圖上查看 →
            </a>
            <span class="text-[11px] text-slate-400 font-mono" x-text="'(' + s.lat + ', ' + s.lng + ')'"></span>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 路線完整站序 popup（點擊路線後彈出） -->
  <div x-show="tip.show"
       x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
       @click.self="hideRoute()"
       @keydown.escape.window="hideRoute()">
    <div class="flex max-h-[85vh] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-slate-900 text-slate-100 text-sm shadow-2xl border border-slate-700">
      <div class="px-3 py-2 border-b border-slate-700 bg-slate-800 flex items-center justify-between gap-2 shrink-0">
        <span class="font-semibold flex items-center gap-2">
          <span class="inline-block rounded bg-blue-300 text-blue-900 px-2 py-0.5 font-bold text-xs inline-flex items-center gap-1"><i class="ph ph-bus"></i> <span x-text="tip.route"></span></span>
          <span class="text-slate-300 text-sm" x-text="'往 ' + tip.dest_tc"></span>
        </span>
        <div class="flex items-center gap-1.5">
          <!-- 群組按鈕：點擊即加入／切換分類，並關閉此 popup、捲回該站卡片 -->
          <template x-for="g in GROUPS" :key="g.id">
            <button @click="setGroup(g.id)"
                    :class="groupOf(tip.stop, tip.route, tip.bound) === g.id
                              ? 'bg-blue-600 text-white ring-2 ring-blue-300'
                              : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-600'"
                    class="shrink-0 rounded-lg px-2.5 py-1 text-xs font-medium transition inline-flex items-center gap-1">
              <i :class="g.icon" class="ph"></i>
              <span x-text="g.label"></span>
            </button>
          </template>
          <button @click="hideRoute()" class="shrink-0 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 text-xs inline-flex items-center gap-1"><i class="ph ph-x text-sm"></i> 關閉</button>
        </div>
      </div>
      <div class="px-3 py-1.5 border-b border-slate-700 text-xs text-slate-400 shrink-0" x-show="tip.loading">
        ⏳ 載入完整路線…
      </div>
      <div class="px-3 py-1.5 border-b border-slate-700 text-xs text-red-300 shrink-0" x-show="tip.error && !tip.loading" x-text="tip.error"></div>
      <div x-show="!tip.loading && !tip.error" class="overflow-y-auto px-3 py-2">
        <template x-if="!tip.variants || tip.variants.length === 0">
          <p class="text-slate-400">（無途經站資料）</p>
        </template>
        <template x-for="(v, vi) in tip.variants" :key="'v' + (v.service_type || '') + vi">
          <div>
            <p class="text-xs text-amber-300 font-semibold mb-1"
               x-show="tip.variants.length > 1"
               x-text="'服務類型 ' + v.service_type + '（' + v.stops.length + ' 個站）'"></p>
            <ol class="list-none space-y-0.5">
              <template x-for="(p, pi) in v.stops" :key="'s' + (v.service_type || '') + pi">
                <li class="flex gap-2">
                  <span class="shrink-0 w-6 text-right text-slate-500 tabular-nums" x-text="p.seq"></span>
                  <span class="text-slate-100" x-text="p.name_tc"></span>
                </li>
              </template>
            </ol>
          </div>
        </template>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function stopFinder() {
      return Object.assign({
        status: 'idle',       // idle | loading | ready | error
        error: '',
        allCount: 0,
        routeCount: 0,
        q: '',
        copied: null,
        searching: false,
        results: [],
        matchCount: 0,         // 符合關鍵字的總數（results 只列前 40 筆）
        // 路線 popup 狀態
        tip: { show: false, key: '', route: '', bound: '', dest_tc: '', stop: '', stopName: '', loading: false, error: '', variants: [] },
        // 我的路線（選擇的路線）—— 以 localStorage 持久化，重新整理後保留
        selection: [],         // { key, stop, stopName, route, bound, dest_tc, group, etas:[], loading, error }
        flashStop: null,       // 剛加入／切換的站：暫時高亮並捲回該站卡片
        // 分類群組
        GROUPS: [
          { id: 'work', label: '上班', icon: 'ph-briefcase' },
          { id: 'home', label: '回家', icon: 'ph-house' }
        ],
        tipCache: {},         // key(route+bound) -> data，避免重複向 server 抓取
        allStops: [],          // 載入的靜態車站（已正規化為前端用形狀）
        routesFull: null,      // 靜態 route|bound → 站序（延遲載入）

        async init() {
          this.status = 'loading';
          try {
            // Option C：直接用靜態 JSON（Cloudflare Pages 提供，無需本機 DB API）
            const stopsArr = await (await fetch('data/stops.json', { headers: { 'Accept': 'application/json' } })).json();
            this.allStops = stopsArr.map(x => ({
              stop: x.s, name_tc: x.tc, name_sc: x.sc, name_en: x.en, lat: x.lat, lng: x.lng,
              routes: (x.routes || []).map(q => ({ route: q.r, bound: q.b, dest_tc: q.d }))
            }));
            const uniq = new Set();
            for (const st of this.allStops) for (const rt of st.routes) uniq.add(rt.route);
            this.allCount = this.allStops.length;
            this.routeCount = uniq.size;
            this.status = 'ready';
          } catch (e) {
            this.error = '無法載入靜態資料（data/stops.json）：' + e.message;
            this.status = 'error';
          }
          // 還原已選路線，讓路線 chip 顯示「★ 已加入」狀態（實時到站在主頁顯示）
          this.restoreSelection();
        },

        doSearch() {
          const kw = this.q.trim().toLowerCase();
          if (!kw) { this.results = []; this.matchCount = 0; this.searching = false; return; }
          this.searching = true;
          try {
            const hits = this.allStops.filter(s =>
              (s.name_tc && s.name_tc.toLowerCase().includes(kw)) ||
              (s.name_sc && s.name_sc.toLowerCase().includes(kw)) ||
              (s.name_en && s.name_en.toLowerCase().includes(kw))
            );
            this.matchCount = hits.length;
            this.results = hits.slice(0, 40);   // 只渲染前 40 筆，筆數已在 matchCount 供提示
          } catch (e) {
            this.error = '搜尋失敗：' + e.message;
          } finally {
            this.searching = false;
          }
        },

        clearQuery() {
          this.q = '';
          this.results = [];
          this.matchCount = 0;
          this.searching = false;
        },

        async copy(text) {
          try {
            await navigator.clipboard.writeText(text);
            this.copied = text;
            setTimeout(() => { if (this.copied === text) this.copied = null; }, 1500);
          } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            this.copied = text;
            setTimeout(() => { if (this.copied === text) this.copied = null; }, 1500);
          }
        },

        async openRoute(r, stopCtx) {
          const key = r.route + '-' + r.bound;
          this.tip.show = true;
          this.tip.key = key;
          this.tip.route = r.route;
          this.tip.bound = r.bound;
          this.tip.dest_tc = r.dest_tc;
          this.tip.stop = (stopCtx && stopCtx.stop) || '';
          this.tip.stopName = (stopCtx && stopCtx.name_tc) || '';
          this.tip.loading = true;
          this.tip.error = '';
          this.tip.variants = [];
          // 已快取則直接顯示
          if (this.tipCache[key]) {
            this.tip.variants = this.tipCache[key];
            this.tip.loading = false;
            return;
          }
          try {
            // 延遲載入靜態站序（首次開啟任何 popup 時抓一次並快取）
            if (!this.routesFull) {
              this.routesFull = await (await fetch('data/routes_full.json', { headers: { 'Accept': 'application/json' } })).json();
            }
            const key2 = r.route + '|' + r.bound;
            const variants = (this.routesFull[key2] || []).map(v => ({
              service_type: v.st,
              stops: v.stops.map(p => ({ seq: p.q, name_tc: p.tc }))
            }));
            this.tipCache[key] = variants;
            // 若彈窗已被關閉，就不更新畫面
            if (this.tip.key !== key) return;
            this.tip.variants = variants;
          } catch (e) {
            if (this.tip.key !== key) return;
            this.tip.error = '無法載入路線：' + e.message;
          } finally {
            if (this.tip.key === key) this.tip.loading = false;
          }
        },

        hideRoute() {
          this.tip.show = false;
          this.tip.key = '';
          this.tip.variants = [];
          this.tip.error = '';
        },

        // ---- 我的路線（選取） ----

        selKey(stop, route, bound) { return stop + '|' + route + '|' + bound; },

        // 該路線目前所在的群組 id；未加入則回傳 null
        groupOf(stop, route, bound) {
          const it = this.selection.find(x => x.key === this.selKey(stop, route, bound));
          return it ? it.group : null;
        },

        isSelected(stop, route, bound) {
          return this.selection.some(it => it.key === this.selKey(stop, route, bound));
        },

        // popup 內的「加入 / 切換群組」：寫入收藏後立即關閉 popup，並捲回該站卡片
        // gid: 'work' | 'home'
        setGroup(gid) {
          const t = this.tip;
          if (!t.stop) return;   // 需要知道是哪一站
          const key = this.selKey(t.stop, t.route, t.bound);
          const existing = this.selection.find(it => it.key === key);
          if (!existing) {
            this.selection.push({                 // 尚未收藏 → 以指定群組加入
              key,
              stop: t.stop,
              stopName: t.stopName,
              route: t.route,
              bound: t.bound,
              dest_tc: t.dest_tc,
              group: gid,
              etas: [],
              loading: false,
              error: ''
            });
            this.saveSelection();
          } else if (existing.group !== gid) {
            existing.group = gid;                 // 已在收藏中 → 切換群組
            this.saveSelection();
          }
          // 已在同一群組再點一次＝維持原狀，不重複加入
          const stop = t.stop;
          this.hideRoute();
          this.flashStop = stop;
          this.$nextTick(() => {
            const el = document.getElementById('stop-' + stop);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
          setTimeout(() => { if (this.flashStop === stop) this.flashStop = null; }, 1600);
        }
      }, bustop);
    }
  </script>
</body>
</html>
